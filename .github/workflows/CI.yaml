name: Platform CI pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - "**"
    # synchronized is when you push new commits
    types: ["opened", "synchronize"]
  # required to enable manual triggers on the GH web ui
  workflow_dispatch:

permissions:
  pull-requests: read
  contents: write

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for modified paths which require the image to be rebuilt
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            changes:
              - '.github/**'
              - 'core/**'
              - 'mzai_platform/**'
              - 'staticfiles/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'

      - name: Log in to DockerHub
        if: steps.filter.outputs.changes == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Truncate commit SHA
        if: steps.filter.outputs.changes == 'true'
        run: echo "GITHUB_SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_ENV

      - name: Set up QEMU
        if: steps.filter.outputs.changes == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker buildx
        if: steps.filter.outputs.changes == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.filter.outputs.changes == 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            mzdotai/mzai-platform-web:platform_${{ env.GITHUB_SHA_SHORT }}
            ${{ github.ref == 'refs/heads/main' && 'mzdotai/mzai-platform-web:latest' || '' }}